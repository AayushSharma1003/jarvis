name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    # THREE platforms, not one. security-model.md's known-limitations section
    # said Windows and Linux path handling — drive letters, UNC paths, 8.3 short
    # names, `\\?\` prefixes, per-volume case rules — was "covered by CI's test
    # run and nothing else". This job ran on ubuntu-latest only, so for Windows
    # that sentence resolved to: covered by nothing. The filesystem sandbox is a
    # security boundary and it had never executed on a platform the project
    # ships an installer for.
    #
    # Runners are the cheapest Windows hardware available, and the suite is 18
    # seconds. Lint stays on one platform — ruff has no opinions that vary by OS.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - if: matrix.os == 'ubuntu-latest'
        run: uv run ruff check .
      # -v and a fixed order on Windows: the first run there ended in a session
      # hang after ".F..Fs", and dots name nothing. -v prints each test id
      # BEFORE running it, so the one that hangs is identified by the last line.
      - if: matrix.os == 'windows-latest'
        run: uv run pytest -v -p no:randomly
      - if: matrix.os != 'windows-latest'
        run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run build

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libgtk-3-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - run: cargo check --manifest-path app/src-tauri/Cargo.toml
      - run: cargo fmt --manifest-path app/src-tauri/Cargo.toml --check

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The README's download button pointed at a specific tag
      # (releases/download/v0.1.0-rc6/Jarvis_0.1.0_aarch64.dmg), so every one of
      # those links would have 404'd the moment the next tag was pushed —
      # silently, on the first page a stranger sees, with nobody watching. The
      # tag-free /releases/latest form cannot rot, so the only thing needed is a
      # check that it does not get "helpfully" pinned again.
      - name: README download links must be direct, and must not be pinned to a tag
        run: |
          set -euo pipefail
          if grep -nE 'releases/download/v[0-9]' README.md; then
            echo "::error file=README.md::download link pinned to a tag — it will 404 after the next release. Use /releases/latest/download/<stable-name>."
            exit 1
          fi
          # A button that lands on a page is not a download button. These are
          # the three names release.yml publishes as stable copies; if one is
          # renamed there and not here, the link 404s silently.
          for asset in Jarvis-macOS-AppleSilicon.dmg \
                       Jarvis-Windows-x64-setup.exe \
                       Jarvis-Linux-x86_64.deb; do
            grep -q "releases/latest/download/$asset" README.md || {
              echo "::error file=README.md::no direct download link for $asset"; exit 1; }
            grep -q "$asset" .github/workflows/release.yml || {
              echo "::error file=release.yml::README links to $asset but the release does not publish it"; exit 1; }
          done
          echo "README download links ok: direct, tag-free, and published by release.yml"
