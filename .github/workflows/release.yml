# Tag push (v*) → build installers for all three platforms, publish a draft
# GitHub Release with artifacts + SHA-256 checksums. Releases are UNSIGNED by
# design (zero budget — see docs/unsigned-install.md); checksums are the
# integrity story, so they are generated in CI, never locally.

name: Release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest # arm64
            bundles: dmg
          - os: windows-latest
            bundles: msi,nsis
          # ubuntu-22.04 on purpose: the runner sets the glibc floor for the
          # .deb, and jammy's 2.35 is what lets it install on older distros.
          # Moving to 24.04 would trade that away.
          #
          # AppImage was CUT in M6.2. Three tags (rc1/rc2/rc3) died at
          # `linuxdeploy` with Tauri swallowing its stderr, and
          # APPIMAGE_EXTRACT_AND_RUN=1 on rc3 failed identically — so it was
          # never the missing-FUSE case it looked like. The .deb is the primary
          # desktop format; if AppImage is ever wanted back, invoke linuxdeploy
          # by hand in its own step so the cause is visible.
          - os: ubuntu-22.04
            bundles: deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libgtk-3-dev

      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - name: Build Python sidecar (PyInstaller onedir)
        working-directory: backend
        run: |
          uv sync
          uv run python ../scripts/build_sidecar.py

      - name: Build app
        working-directory: app
        run: |
          npm ci
          # tauri.release.conf.json layers in the sidecar resources, which only
          # exist after the sidecar build step (keeps plain `cargo check` green).
          npm run tauri build -- --config src-tauri/tauri.release.conf.json --bundles ${{ matrix.bundles }}

      # A build gate, not a formality. Unsigned and BROKEN-signed are two very
      # different products on macOS, and they look identical until a user with
      # a quarantined download double-clicks:
      #
      #   consistent ad-hoc signature -> "cannot be verified"  -> Open Anyway works
      #   resource seal missing       -> "is damaged"           -> Open Anyway CANNOT fix it
      #
      # Every build before M6.2 was the second kind. Tauri never signed the
      # bundle (no `macOS.signingIdentity`), so `_CodeSignature/CodeResources`
      # was absent while the code directory said resources must be sealed —
      # `codesign --verify --strict` failed on every artifact ever shipped, and
      # nothing noticed, because a build downloaded with `gh` carries no
      # quarantine and Gatekeeper is therefore never consulted. See gotcha 34.
      - name: Verify the macOS bundle signature
        if: runner.os == 'macOS'
        run: |
          APP=app/src-tauri/target/release/bundle/macos/Jarvis.app
          # Fails loudly on a missing or inconsistent resource seal.
          codesign --verify --deep --strict --verbose=2 "$APP"
          # And assert it is ad-hoc, so nobody "fixes" this gate by quietly
          # requiring a paid identity the project has decided not to buy.
          codesign -dv "$APP" 2>&1 | grep -q 'Signature=adhoc'
          echo "bundle signature ok: consistent ad-hoc seal"

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p release-artifacts
          find app/src-tauri/target/release/bundle \
            \( -name '*.dmg' -o -name '*.msi' -o -name '*.exe' \
               -o -name '*.deb' \) \
            -exec cp {} release-artifacts/ \;
          ls -la release-artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: bundles-${{ matrix.os }}
          path: release-artifacts/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: all
          merge-multiple: true
      - name: Generate SHA-256 checksums
        working-directory: all
        run: sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: all/*
          body: |
            Unsigned release — verify your download against SHA256SUMS.txt.
            Install instructions per OS: see docs/unsigned-install.md.
