# Tag push (v*) → build installers for all three platforms, publish a draft
# GitHub Release with artifacts + SHA-256 checksums. Releases are UNSIGNED by
# design (zero budget — see docs/unsigned-install.md); checksums are the
# integrity story, so they are generated in CI, never locally.

name: Release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest # arm64
            bundles: dmg
          - os: windows-latest
            bundles: msi,nsis
          # ubuntu-22.04 on purpose: the runner sets the glibc floor for the
          # .deb, and jammy's 2.35 is what lets it install on older distros.
          # Moving to 24.04 would trade that away.
          #
          # AppImage was CUT in M6.2. Three tags (rc1/rc2/rc3) died at
          # `linuxdeploy` with Tauri swallowing its stderr, and
          # APPIMAGE_EXTRACT_AND_RUN=1 on rc3 failed identically — so it was
          # never the missing-FUSE case it looked like. The .deb is the primary
          # desktop format; if AppImage is ever wanted back, invoke linuxdeploy
          # by hand in its own step so the cause is visible.
          - os: ubuntu-22.04
            bundles: deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libgtk-3-dev

      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - name: Build Python sidecar (PyInstaller onedir)
        working-directory: backend
        run: |
          uv sync
          uv run python ../scripts/build_sidecar.py

      - name: Build app
        working-directory: app
        run: |
          npm ci
          # tauri.release.conf.json layers in the sidecar resources, which only
          # exist after the sidecar build step (keeps plain `cargo check` green).
          npm run tauri build -- --config src-tauri/tauri.release.conf.json --bundles ${{ matrix.bundles }}

      # A build gate, not a formality. Unsigned and BROKEN-signed are two very
      # different products on macOS, and they look identical until a user with
      # a quarantined download double-clicks:
      #
      #   consistent ad-hoc signature -> "cannot be verified"  -> Open Anyway works
      #   resource seal missing       -> "is damaged"           -> Open Anyway CANNOT fix it
      #
      # Every build before M6.2 was the second kind. Tauri never signed the
      # bundle (no `macOS.signingIdentity`), so `_CodeSignature/CodeResources`
      # was absent while the code directory said resources must be sealed —
      # `codesign --verify --strict` failed on every artifact ever shipped, and
      # nothing noticed, because a build downloaded with `gh` carries no
      # quarantine and Gatekeeper is therefore never consulted. See gotcha 34.
      # NOTE ON WHAT THIS INSPECTS, because the obvious version is broken:
      # `--bundles dmg` DELETES target/release/bundle/macos/Jarvis.app once the
      # dmg is built ("Cleaning ...Jarvis.app" in the log), so a gate pointed at
      # that path fails with "No such file" on every real tag. It is also the
      # wrong thing to check. Gotcha 34's lesson is to verify the artifact the
      # user receives rather than a convenient proxy, so this mounts the dmg and
      # checks the bundle that actually ships.
      - name: Verify the macOS bundle signature and entitlements
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          DMG=$(find app/src-tauri/target/release/bundle/dmg -name '*.dmg' | head -1)
          [ -n "$DMG" ] || { echo "::error::no dmg produced"; exit 1; }
          MP=$(mktemp -d)
          hdiutil attach "$DMG" -nobrowse -readonly -mountpoint "$MP" >/dev/null
          trap 'hdiutil detach "$MP" >/dev/null 2>&1 || true' EXIT
          APP="$MP/Jarvis.app"

          # Fails loudly on a missing or inconsistent resource seal. Every build
          # before M6.2 failed here: Tauri was never told to sign the bundle, so
          # CodeResources was absent while the code directory said resources
          # must be sealed. Nothing noticed, because a build downloaded with
          # `gh` carries no quarantine and Gatekeeper is never consulted.
          codesign --verify --deep --strict --verbose=2 "$APP"

          # Read once, match in-shell. NOT `codesign ... | grep -q`: grep -q
          # exits at the first match, codesign takes SIGPIPE, and `pipefail`
          # turns that into exit 141 — a gate that fails on a bundle that is
          # perfectly fine. (Observed; this whole step is here because gates
          # that have never been run are decoration.)
          desc=$(codesign -dvvv "$APP" 2>&1)

          # Assert it is ad-hoc, so nobody "fixes" this gate by quietly
          # requiring a paid identity the project has decided not to buy.
          case "$desc" in
            *"Signature=adhoc"*) ;;
            *) echo "::error::bundle is not ad-hoc signed"; exit 1 ;;
          esac

          # The other half, and the half that cost a day (gotcha 36). Signing
          # the bundle also turns ON the hardened runtime, which is what makes
          # entitlements ENFORCED instead of ignored — so M6.2's Gatekeeper fix
          # silently took the microphone away. A hardened process without
          # `com.apple.security.device.audio-input` gets a stream that opens
          # normally and returns exactly 0.0 forever, with NO permission prompt
          # (the request is refused before TCC is consulted, which is why
          # `tccutil reset` does nothing). Wake word and push-to-talk both die
          # and every automated check stays green.
          case "$desc" in
            *"flags="*"runtime"*) ;;
            *) echo "::error::hardened runtime missing — re-check signing"; exit 1 ;;
          esac

          ent=$(codesign -d --entitlements - --xml "$APP" 2>/dev/null \
                  | plutil -convert xml1 -o - - 2>/dev/null || true)
          case "$ent" in
            *"com.apple.security.device.audio-input"*) ;;
            *) echo "::error::mic entitlement missing — the app ships silently deaf (gotcha 36)"; exit 1 ;;
          esac

          echo "shipped bundle ok: ad-hoc seal + hardened runtime + audio-input"

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p release-artifacts
          find app/src-tauri/target/release/bundle \
            \( -name '*.dmg' -o -name '*.msi' -o -name '*.exe' \
               -o -name '*.deb' \) \
            -exec cp {} release-artifacts/ \;
          ls -la release-artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: bundles-${{ matrix.os }}
          path: release-artifacts/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: all
          merge-multiple: true
      - name: Generate SHA-256 checksums
        working-directory: all
        run: sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: all/*
          body: |
            Unsigned release — verify your download against SHA256SUMS.txt.
            Install instructions per OS: see docs/unsigned-install.md.
